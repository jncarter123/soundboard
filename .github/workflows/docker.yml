name: docker

# Tag a release and the image follows it to Docker Hub. The manual run is for
# publishing whatever is on a branch right now without minting a version.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to publish (e.g. edge). The commit SHA is always published.'
        required: false
        default: ''

permissions:
  contents: read

env:
  # Docker Hub namespace. The Hub account (jncarter) differs from the GitHub
  # owner (jncarter123), so this repository sets a DOCKERHUB_USERNAME variable
  # (Settings > Secrets and variables > Actions > Variables, repository scope).
  # Without it the login falls back to the GitHub owner and fails as
  # "incorrect username or password".
  NAMESPACE: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # arm64 is built under emulation on this x86 runner, so Apple Silicon
      # and Graviton hosts can pull the same tag.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # "incorrect username or password" does not say which username was tried,
      # and NAMESPACE silently falls back to the GitHub owner. Print it.
      - name: Say who we are logging in as
        run: echo "Logging in to Docker Hub as '${{ env.NAMESPACE }}'"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.NAMESPACE }}/soundboard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Authenticates Composer's api.github.com downloads, which fail first
          # when anonymous from a shared runner IP. Read-only, costs nothing.
          secrets: |
            composer_auth={"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
